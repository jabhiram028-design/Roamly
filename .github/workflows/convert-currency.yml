name: Convert currency display

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  convert-currency:
    if: github.event.head_commit.message != 'chore: apply INR currency display'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Convert currency labels
        run: |
          find src -type f \( -name '*.tsx' -o -name '*.ts' \) -print0 | xargs -0 sed -i 's/\$/₹/g; s/ USD/ INR/g'

      - name: Commit currency changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src
          if git diff --cached --quiet; then
            echo 'No currency changes needed.'
            exit 0
          fi
          git commit -m 'chore: apply INR currency display'
          git push